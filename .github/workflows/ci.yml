name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Explicit combinations rather than a cross-product: each Rails version
      # here supports a different Ruby range, and Rails 6.1/7.0 additionally
      # require sqlite3 ~> 1.4 (pinned in their gemfiles), which is not
      # installable on every Ruby in the matrix.
      matrix:
        include:
          - { ruby: '2.7', rails: '6.1' }
          - { ruby: '3.0', rails: '6.1' }
          - { ruby: '3.1', rails: '6.1' }
          - { ruby: '2.7', rails: '7.0' }
          - { ruby: '3.0', rails: '7.0' }
          - { ruby: '3.1', rails: '7.0' }
          - { ruby: '3.1', rails: '7.1' }
          - { ruby: '3.2', rails: '7.1' }
          - { ruby: '3.3', rails: '7.1' }
          - { ruby: '3.4', rails: '7.1' }
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Ruby Tests
        run: bundle exec rake
